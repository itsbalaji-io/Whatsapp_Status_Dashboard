services:
  openwa-api:
    image: rmyndharis/openwa:latest
    container_name: openwa-api
    restart: unless-stopped
    stop_grace_period: 75s
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    shm_size: '2gb'
    tmpfs:
      - /tmp
    pids_limit: ${OPENWA_PIDS_LIMIT:-4096}
    ports:
      - '2785:2785'
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=2785
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - LOG_LEVEL=info
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - AUTO_START_SESSIONS=true
      - CSP_UPGRADE_INSECURE_REQUESTS=false
      - ENGINE_TYPE=baileys
      - API_MASTER_KEY=trust-me-bro-this-is-ultra-secure-key
      - RATE_LIMIT_SHORT_LIMIT=100
      - RATE_LIMIT_MEDIUM_LIMIT=1000
    volumes:
      - openwa_data:/app/data
      - ./patches/Client.js:/app/node_modules/whatsapp-web.js/src/Client.js:ro
      - ./patches/baileys-status.js:/app/dist/engine/adapters/baileys-status.js:ro
      - ./patches/messages-send.js:/app/node_modules/@whiskeysockets/baileys/lib/Socket/messages-send.js:ro
    networks:
      automation-network:
        aliases:
          - openwa
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  whatsapp-status-web:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: whatsapp-status-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENWA_BASE_URL=http://openwa-api:2785
      - OPENWA_API_KEY=trust-me-bro-this-is-ultra-secure-key
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
    volumes:
      - ./web-app/data:/app/data
      - ./web-app/uploads:/app/uploads
    networks:
      automation-network:
        aliases:
          - web-app
    depends_on:
      openwa-api:
        condition: service_healthy

volumes:
  openwa_data:
    name: openwa_data


networks:
  automation-network:
    name: automation-network
    driver: bridge
